<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Auth Example</title>
</head>
<body>
    <h1>NEAR App Sign-In</h1>
    
    <div id="auth-section">
        <div id="sign-in-form">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button id="sign-in-btn">Sign In</button>
            <button id="sign-up-btn">Sign Up</button>
        </div>
        
        <div id="welcome-section" style="display:none;">
            <p>Welcome! You’re signed in.</p>
            <button id="sign-out-btn">Sign Out</button>
        </div>
    </div>

    <!-- Firebase App (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js"></script>

    <script>
      // Your Firebase config object
      const firebaseConfig = {
        apiKey: "AIzaSyA2ApGkST41s9U53GQIatv4FL8aCPVzeAM",
        authDomain: "near-c7681.firebaseapp.com",
        projectId: "near-c7681",
        storageBucket: "near-c7681.appspot.com",
        messagingSenderId: "316318833624",
        appId: "1:316318833624:web:480beb2c1909e23d1cf0ad",
        measurementId: "G-98XYEKXLLT"
      };

      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();

      // Sign In
      document.getElementById('sign-in-btn').addEventListener('click', () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        auth.signInWithEmailAndPassword(email, password)
          .then(() => {
            document.getElementById('sign-in-form').style.display = 'none';
            document.getElementById('welcome-section').style.display = 'block';
          })
          .catch(error => alert(error.message));
      });

      // Sign Up
      document.getElementById('sign-up-btn').addEventListener('click', () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        auth.createUserWithEmailAndPassword(email, password)
          .then(() => alert('User created! Now sign in.'))
          .catch(error => alert(error.message));
      });

      // Sign Out
      document.getElementById('sign-out-btn').addEventListener('click', () => {
        auth.signOut().then(() => {
            document.getElementById('sign-in-form').style.display = 'block';
            document.getElementById('welcome-section').style.display = 'none';
        });
      });
    </script>
</body>
</html>
